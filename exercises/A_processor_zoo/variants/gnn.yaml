# =============================================================================
# AIWCAS 2026 hour 2 -- Option A "processor zoo" -- SOLUTION variant (GNN)
#
# Same data, graph, loss and training recipe as every other option-A run; only the
# processor changes. This is the GNN (message-passing) answer:
# the same model as configs/04_tiny_train.yaml, written standalone.
#
#   aiwcas validate exercises/A_processor_zoo/variants/gnn.yaml
#   aiwcas train exercises/A_processor_zoo/variants/gnn.yaml
#
# Standalone on purpose: it does NOT build on configs/04_tiny_train.yaml.
# =============================================================================
defaults:
  - data: zarr
  - dataloader: native_grid
  - diagnostics: evaluation
  - system: example
  - graph: multi_scale            # same graph file as the GraphTransformer
  - model: gnn
  - task: forecaster
  - training: single
  - _self_

config_validation: True

hydra:
  run:
    dir: ${oc.env:SCRATCH}/aiwcas26/hour2/hydra/${now:%Y-%m-%d_%H-%M-%S}

# ----------------------------------------------------------------------------- system
system:
  hardware:
    accelerator: cuda
    num_gpus_per_node: 1
    num_nodes: 1
    num_gpus_per_model: 1
  input:
    dataset: /leonardo_work/tra26_aiwcas/a08trd25/data/anemoi/aifs-ea-an-oper-0001-mars-o96-2017-2017-6h-v8-testing.zarr
    # Built on the first run, then reused (graph.overwrite: False). The file name
    # encodes the recipe: change the name if you change the graph section!
    graph: ${oc.env:SCRATCH}/aiwcas26/hour2/graphs/o96_multiscale_tri4.pt
  output:
    root: ${oc.env:SCRATCH}/aiwcas26/hour2/A_processor_zoo

# ----------------------------------------------------------------------------- dataloader
dataloader:
  num_workers:
    training: 6
    validation: 2
    test: 1
  batch_size:
    training: 1
    validation: 1
    test: 1
  limit_batches:
    training: null
    validation: 4
    test: 1
  training:
    datasets:
      data:
        start: 2017-01-01
        end: 2017-01-08
  validation:
    datasets:
      data:
        start: 2017-01-09
        end: 2017-01-10
  test:
    datasets:
      data:
        start: 2017-01-09
        end: 2017-01-10

# ----------------------------------------------------------------------------- graph
graph:
  overwrite: False
  nodes:
    hidden:
      node_builder:
        resolution: 4             # refined icosahedron level 4 = 2562 hidden nodes

# ----------------------------------------------------------------------------- model
model:
  num_channels: 64
  compile: null
  processor:
    num_layers: 4
    num_chunks: 1                 # GNN: message passing, no attention -> no num_heads / backend keys

# ----------------------------------------------------------------------------- task
task:
  multistep_input: 2
  rollout:
    start: 1
    epoch_increment: 0
    maximum: 1

# ----------------------------------------------------------------------------- training
training:
  max_epochs: null
  max_steps: 500
  num_sanity_val_steps: 0
  precision: 16-mixed
  optimization:
    lr: 1.0e-3
    lr_scheduler:
      warmup_t: 20
      lr_min: 1.0e-5

# ----------------------------------------------------------------------------- diagnostics
diagnostics:
  callbacks: []
  log:
    mlflow:
      enabled: True
      offline: True
      tracking_uri: null
      authentication: False
      experiment_name: hour2-A    # keep: the scoreboard uses it as the option label
      run_name: A-gnn
      terminal: False
      system: False
    interval: 10
  plot:
    settings:
      datashader: False
    callbacks: []
  benchmark_profiler:
    memory:
      enabled: False
    snapshot:
      enabled: False
  checkpoint:
    every_n_minutes:
      save_frequency: null
      num_models_saved: 0
    every_n_epochs:
      save_frequency: 5
      num_models_saved: 1
    every_n_train_steps:
      save_frequency: null
      num_models_saved: 0
  progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 10
