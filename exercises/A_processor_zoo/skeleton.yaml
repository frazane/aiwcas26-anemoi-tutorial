# =============================================================================
# AIWCAS 2026 hour 2 -- Option A "processor zoo" -- SKELETON
#
# Same data, graph nodes, loss and training recipe for everybody; YOU pick the
# processor (the middle of encoder -> processor -> decoder). Fill every ??? :
#   TODO(1) pick a processor          TODO(2) the graph it needs
#   TODO(3) name the graph file       TODO(4) processor-specific model section (RECIPES at the end)
#   TODO(5) name your run
#
#   cp exercises/A_processor_zoo/skeleton.yaml exercises/A_processor_zoo/mine.yaml   # edit mine.yaml
#   aiwcas validate exercises/A_processor_zoo/mine.yaml
#   aiwcas train exercises/A_processor_zoo/mine.yaml
#
# Stuck? solution.yaml (GraphTransformer) and variants/*.yaml are the answers.
#
# Standalone on purpose: it does NOT build on configs/04_tiny_train.yaml.
# =============================================================================
defaults:
  - data: zarr
  - dataloader: native_grid
  - diagnostics: evaluation
  - system: example
  - graph: multi_scale            # TODO(2): all three use these nodes; the transformer also
                                  #   replaces the edge list (graph section, RECIPES part 2)
  - model: ???                    # TODO(1): ONE of  gnn | graphtransformer | transformer
                                  #   (point_wise: see the RECIPES at the end, it is a special case)
  - task: forecaster
  - training: single
  - _self_

config_validation: True

hydra:
  run:
    dir: ${oc.env:SCRATCH}/aiwcas26/hour2/hydra/${now:%Y-%m-%d_%H-%M-%S}

# ----------------------------------------------------------------------------- system
system:
  hardware:
    accelerator: cuda
    num_gpus_per_node: 1
    num_nodes: 1
    num_gpus_per_model: 1
  input:
    dataset: /leonardo_work/tra26_aiwcas/a08trd25/data/anemoi/aifs-ea-an-oper-0001-mars-o96-2017-2017-6h-v8-testing.zarr
    # Built on the first run, then reused (graph.overwrite: False), so ONE FILE PER RECIPE.
    # A stale file with the wrong edges gives confusing errors. Use exactly:
    #   gnn, graphtransformer : ${oc.env:SCRATCH}/aiwcas26/hour2/graphs/o96_multiscale_tri4.pt
    #   transformer           : ${oc.env:SCRATCH}/aiwcas26/hour2/graphs/o96_encdec_tri4.pt
    graph: ???                    # TODO(3)
  output:
    root: ${oc.env:SCRATCH}/aiwcas26/hour2/A_processor_zoo

# ----------------------------------------------------------------------------- dataloader
dataloader:
  num_workers:
    training: 6
    validation: 2
    test: 1
  batch_size:
    training: 1
    validation: 1
    test: 1
  limit_batches:
    training: null
    validation: 4
    test: 1
  training:
    datasets:
      data:
        start: 2017-01-01
        end: 2017-01-08
  validation:
    datasets:
      data:
        start: 2017-01-09
        end: 2017-01-10
  test:
    datasets:
      data:
        start: 2017-01-09
        end: 2017-01-10

# ----------------------------------------------------------------------------- graph
graph:
  overwrite: False
  # transformer: REPLACE this whole `graph:` section with the one in RECIPES below.
  nodes:
    hidden:
      node_builder:
        resolution: 4             # refined icosahedron level 4 = 2562 hidden nodes

# ----------------------------------------------------------------------------- model
# TODO(4): gnn: keep this section as it is. graphtransformer / transformer: REPLACE the
#          whole `model:` section below with the block for your processor from RECIPES at
#          the end of this file (remove the leading "# "). The schema rejects keys a
#          processor does not know, so do not mix the blocks.
# Keep num_channels / num_layers as they are so the room's runs stay comparable.
model:
  num_channels: 64
  compile: null                   # no torch.compile: it costs minutes of a 10-min job
  processor:
    num_layers: 4
    num_chunks: 1

# ----------------------------------------------------------------------------- task
task:
  multistep_input: 2
  rollout:
    start: 1
    epoch_increment: 0
    maximum: 1

# ----------------------------------------------------------------------------- training
training:
  max_epochs: null
  max_steps: 500
  num_sanity_val_steps: 0
  precision: 16-mixed
  optimization:
    lr: 1.0e-3
    lr_scheduler:
      warmup_t: 20
      lr_min: 1.0e-5

# ----------------------------------------------------------------------------- diagnostics
diagnostics:
  callbacks: []
  log:
    mlflow:
      enabled: True
      offline: True
      tracking_uri: null
      authentication: False
      experiment_name: hour2-A    # keep: the scoreboard uses it as the option label
      run_name: ???                 # TODO(5): e.g. A-gt-<yourname>; shows up on the scoreboard
      terminal: False
      system: False
    interval: 10
  plot:
    settings:
      datashader: False
    callbacks: []
  benchmark_profiler:
    memory:
      enabled: False
    snapshot:
      enabled: False
  checkpoint:
    every_n_minutes:
      save_frequency: null
      num_models_saved: 0
    every_n_epochs:
      save_frequency: 5
      num_models_saved: 1
    every_n_train_steps:
      save_frequency: null
      num_models_saved: 0
  progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 10

