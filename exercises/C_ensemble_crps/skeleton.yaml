# =============================================================================
# AIWCAS 2026 hour 2 -- Option C "ensemble CRPS, AIFS-ENS style" -- SKELETON
#
# The same O96 forecaster, now PROBABILISTIC: for every training sample the model
# makes several forecasts (ensemble members) that differ only by random noise
# injected into the processor, and the loss is the almost-fair CRPS (afCRPS) of
# that ensemble against the analysis. This is the AIFS-ENS training recipe in
# miniature. Fill every ??? :
#   TODO(1) an ensemble model            TODO(2) the ensemble training method
#   TODO(3) members per sample           TODO(4) GPUs per ensemble
#   TODO(5) switch torch.compile off     TODO(6) fair vs standard CRPS
#   TODO(7) name your run
#
#   cp exercises/C_ensemble_crps/skeleton.yaml exercises/C_ensemble_crps/mine.yaml   # edit mine.yaml
#   anemoi-training config validate --config-path exercises/C_ensemble_crps --config-name mine
#   scripts/submit.sh exercises/C_ensemble_crps/mine.yaml
#
# Stuck? solution.yaml is the answer.
#
# Standalone on purpose: it does NOT build on configs/04_tiny_train.yaml.
# =============================================================================
defaults:
  - data: zarr
  - dataloader: native_grid
  - diagnostics: evaluation_ens   # ensemble plots + a RolloutEval callback (both switched off below)
  - system: example
  - graph: multi_scale
  - model: ???                    # TODO(1): a model that takes noise -> different members. Look in
                                  #   src/anemoi-core/training/src/anemoi/training/config/model/*_ens.yaml
                                  #   (use the GraphTransformer one: the transformer needs flash-attn)
  - task: forecaster              # the TASK does not change ...
  - training: ???                 # TODO(2): ... only the training METHOD: which file in
                                  #   .../config/training/ uses EnsembleTraining and a CRPS loss?
  - _self_

config_validation: True

hydra:
  run:
    dir: ${oc.env:SCRATCH}/aiwcas26/hour2/hydra/${now:%Y-%m-%d_%H-%M-%S}

# ----------------------------------------------------------------------------- system
system:
  hardware:
    accelerator: cuda
    num_gpus_per_node: 1
    num_nodes: 1
    num_gpus_per_model: 1
    num_gpus_per_ensemble: ???    # TODO(4): over how many GPUs are the members spread? (we have 1)
  input:
    dataset: /leonardo_work/tra26_aiwcas/a08trd25/data/anemoi/aifs-ea-an-oper-0001-mars-o96-2017-2017-6h-v8-testing.zarr
    graph: ${oc.env:SCRATCH}/aiwcas26/hour2/graphs/o96_multiscale_tri4.pt   # same graph as options 0 and A
  output:
    root: ${oc.env:SCRATCH}/aiwcas26/hour2/C_ensemble_crps

# ----------------------------------------------------------------------------- dataloader
dataloader:
  num_workers:
    training: 6
    validation: 2
    test: 1
  batch_size:
    training: 1
    validation: 1
    test: 1
  limit_batches:
    training: null
    validation: 4
    test: 1
  training:
    datasets:
      data:
        start: 2017-01-01
        end: 2017-01-08
  validation:
    datasets:
      data:
        start: 2017-01-09
        end: 2017-01-10
  test:
    datasets:
      data:
        start: 2017-01-09
        end: 2017-01-10

# ----------------------------------------------------------------------------- graph
graph:
  overwrite: False
  nodes:
    hidden:
      node_builder:
        resolution: 4

# ----------------------------------------------------------------------------- model
model:
  num_channels: 64
  compile: ???                    # TODO(5): the ensemble model's default compiles the CRPS loss with
                                  #   mode=max-autotune: minutes of a 10-min job. How do you say "nothing"?
  noise_injector:
    noise_channels_dim: 4         # size of the noise vector that conditions every LayerNorm
  processor:
    num_layers: 4
    num_chunks: 1
    num_heads: 4
    graph_attention_backend: triton
  encoders:
    "0":
      mapper:
        num_chunks: 1
        num_heads: 4
        graph_attention_backend: triton
  decoders:
    "0":
      mapper:
        num_chunks: 1
        num_heads: 4
        graph_attention_backend: triton

# ----------------------------------------------------------------------------- task
task:
  multistep_input: 2
  rollout:
    start: 1
    epoch_increment: 0
    maximum: 1

# ----------------------------------------------------------------------------- training
training:
  ensemble_size_per_device: ???   # TODO(3): members per sample. CRPS needs >= 2; cost grows
                                  #   ~linearly. 4 fits a 10-min job comfortably.
  max_epochs: null
  max_steps: 400                # 4 members cost more per step; 400 keeps the job well under 10 min
  num_sanity_val_steps: 0
  precision: 16-mixed
  optimization:
    lr: 1.0e-3
    lr_scheduler:
      warmup_t: 20
      lr_min: 1.0e-5
  training_loss:
    datasets:
      data:
        per_scale_loss:
          alpha: ???              # TODO(6): 1.0 = fair CRPS (unbiased for finite ensembles),
                                  #   0.0 = standard CRPS, in between = "almost fair" (AIFS-ENS: 0.95)

# ----------------------------------------------------------------------------- diagnostics
diagnostics:
  callbacks: []                   # drop RolloutEval: it needs task.validation_rollout (null here)
  log:
    mlflow:
      enabled: True
      offline: True
      tracking_uri: null
      authentication: False
      experiment_name: hour2-C    # keep: the scoreboard uses it as the option label
      run_name: ???                 # TODO(7): e.g. C-ens4-<yourname>; shows up on the scoreboard
      terminal: False
      system: False
    interval: 10
  plot:
    settings:
      datashader: False
    callbacks: []
  benchmark_profiler:
    memory:
      enabled: False
    snapshot:
      enabled: False
  checkpoint:
    every_n_minutes:
      save_frequency: null
      num_models_saved: 0
    every_n_epochs:
      save_frequency: 5
      num_models_saved: 1
    every_n_train_steps:
      save_frequency: null
      num_models_saved: 0
  progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 10
