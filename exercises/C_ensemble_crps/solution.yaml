# =============================================================================
# AIWCAS 2026 hour 2 -- Option C "ensemble CRPS, AIFS-ENS style" -- SOLUTION
#
# The same O96 forecaster, now PROBABILISTIC: for every training sample the model
# makes several forecasts (ensemble members) that differ only by random noise
# injected into the processor, and the loss is the almost-fair CRPS (afCRPS) of
# that ensemble against the analysis. This is the AIFS-ENS training recipe in
# miniature: 4 members, 64 channels, 4 layers.
#
#   anemoi-training config validate --config-path exercises/C_ensemble_crps --config-name solution
#   scripts/submit.sh exercises/C_ensemble_crps/solution.yaml
#
# Standalone on purpose: it does NOT build on configs/04_tiny_train.yaml.
# =============================================================================
defaults:
  - data: zarr
  - dataloader: native_grid
  - diagnostics: evaluation_ens   # ensemble plots + a RolloutEval callback (both switched off below)
  - system: example
  - graph: multi_scale
  - model: graphtransformer_ens   # TODO(1) answer: noise-conditioned GraphTransformer (AnemoiEnsModelEncProcDec)
  - task: forecaster              # the TASK does not change ...
  - training: ensemble            # TODO(2) answer: ... only the training METHOD (EnsembleTraining + CRPS loss)
  - _self_

config_validation: True

hydra:
  run:
    dir: ${oc.env:SCRATCH}/aiwcas26/hour2/hydra/${now:%Y-%m-%d_%H-%M-%S}

# ----------------------------------------------------------------------------- system
system:
  hardware:
    accelerator: cuda
    num_gpus_per_node: 1
    num_nodes: 1
    num_gpus_per_model: 1
    num_gpus_per_ensemble: 1      # TODO(4) answer: all members live on our single GPU
  input:
    dataset: /leonardo_work/tra26_aiwcas/a08trd25/data/anemoi/aifs-ea-an-oper-0001-mars-o96-2017-2017-6h-v8-testing.zarr
    graph: ${oc.env:SCRATCH}/aiwcas26/hour2/graphs/o96_multiscale_tri4.pt   # same graph as options 0 and A
  output:
    root: ${oc.env:SCRATCH}/aiwcas26/hour2/C_ensemble_crps

# ----------------------------------------------------------------------------- dataloader
dataloader:
  num_workers:
    training: 6
    validation: 2
    test: 1
  batch_size:
    training: 1
    validation: 1
    test: 1
  limit_batches:
    training: null
    validation: 4
    test: 1
  training:
    datasets:
      data:
        start: 2017-01-01
        end: 2017-01-08
  validation:
    datasets:
      data:
        start: 2017-01-09
        end: 2017-01-10
  test:
    datasets:
      data:
        start: 2017-01-09
        end: 2017-01-10

# ----------------------------------------------------------------------------- graph
graph:
  overwrite: False
  nodes:
    hidden:
      node_builder:
        resolution: 4

# ----------------------------------------------------------------------------- model
model:
  num_channels: 64
  compile: null                   # TODO(5) answer: the ens default compiles CRPS with mode=max-autotune (minutes!)
  noise_injector:
    noise_channels_dim: 4         # size of the noise vector that conditions every LayerNorm
  processor:
    num_layers: 4
    num_chunks: 1
    num_heads: 4
    graph_attention_backend: triton
  encoders:
    "0":
      mapper:
        num_chunks: 1
        num_heads: 4
        graph_attention_backend: triton
  decoders:
    "0":
      mapper:
        num_chunks: 1
        num_heads: 4
        graph_attention_backend: triton

# ----------------------------------------------------------------------------- task
task:
  multistep_input: 2
  rollout:
    start: 1
    epoch_increment: 0
    maximum: 1

# ----------------------------------------------------------------------------- training
training:
  ensemble_size_per_device: 4     # TODO(3) answer: members per sample (cost grows ~linearly)
  max_epochs: null
  max_steps: 400                # 4 members cost more per step; 400 keeps the job well under 10 min
  num_sanity_val_steps: 0
  precision: 16-mixed
  optimization:
    lr: 1.0e-3
    lr_scheduler:
      warmup_t: 20
      lr_min: 1.0e-5
  training_loss:
    datasets:
      data:
        per_scale_loss:
          alpha: 0.95             # TODO(6) answer: 1.0 = fair CRPS, 0.0 = standard CRPS; AIFS-ENS uses 0.95

# ----------------------------------------------------------------------------- diagnostics
diagnostics:
  callbacks: []                   # drop RolloutEval: it needs task.validation_rollout (null here)
  log:
    mlflow:
      enabled: True
      offline: True
      tracking_uri: null
      authentication: False
      experiment_name: hour2-C    # keep: the scoreboard uses it as the option label
      run_name: C-gt-ens4-afcrps  # TODO(7) answer
      terminal: False
      system: False
    interval: 10
  plot:
    settings:
      datashader: False
    callbacks: []
  benchmark_profiler:
    memory:
      enabled: False
    snapshot:
      enabled: False
  checkpoint:
    every_n_minutes:
      save_frequency: null
      num_models_saved: 0
    every_n_epochs:
      save_frequency: 5
      num_models_saved: 1
    every_n_train_steps:
      save_frequency: null
      num_models_saved: 0
  progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 10
