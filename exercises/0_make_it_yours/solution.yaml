# =============================================================================
# AIWCAS 2026 hour 2 -- Option 0 "make the base yours" -- SOLUTION
#
# The hour-1 GNN forecaster, with YOUR choices of variables, loss weights, input
# history (multistep) and rollout. This is one possible answer to skeleton.yaml:
#   * a 33-variable model (surface + 500/850 hPa) instead of all 101,
#   * 2 m temperature weighted 5x more in the loss,
#   * 1 input step instead of 2,
#   * rollout 2: the model is trained on its own 6 h forecast as well.
#
#   anemoi-training config validate --config-path exercises/0_make_it_yours --config-name solution
#   scripts/submit.sh exercises/0_make_it_yours/solution.yaml
#
# Standalone on purpose: it does NOT build on configs/04_tiny_train.yaml.
# =============================================================================
defaults:
  - data: zarr                    # forcing / diagnostic lists, normalisers
  - dataloader: native_grid
  - diagnostics: evaluation
  - system: example
  - graph: multi_scale
  - model: gnn
  - task: forecaster
  - training: single
  - _self_

config_validation: True

hydra:
  run:
    dir: ${oc.env:SCRATCH}/aiwcas26/hour2/hydra/${now:%Y-%m-%d_%H-%M-%S}

# ----------------------------------------------------------------------------- system
system:
  hardware:
    accelerator: cuda
    num_gpus_per_node: 1
    num_nodes: 1
    num_gpus_per_model: 1
  input:
    dataset: /leonardo_work/tra26_aiwcas/a08trd25/data/anemoi/aifs-ea-an-oper-0001-mars-o96-2017-2017-6h-v8-testing.zarr
    # Same graph as option A (built on the first run, then reused). Selecting
    # variables does not change the grid, so the graph does not change either.
    graph: ${oc.env:SCRATCH}/aiwcas26/hour2/graphs/o96_multiscale_tri4.pt
  output:
    root: ${oc.env:SCRATCH}/aiwcas26/hour2/0_make_it_yours

# ----------------------------------------------------------------------------- dataloader
dataloader:
  num_workers:
    training: 6
    validation: 2
    test: 1
  batch_size:
    training: 1
    validation: 1
    test: 1
  limit_batches:
    training: null
    validation: 4
    test: 1
  training:
    datasets:
      data:
        dataset_config:
          # TODO(1) answer: which variables the model sees. Everything named in
          # data.datasets.data.forcing / diagnostic below must be in this list.
          select: [
            # forcings (inputs only, never predicted)
            cos_latitude, cos_longitude, sin_latitude, sin_longitude,
            cos_julian_day, cos_local_time, sin_julian_day, sin_local_time,
            insolation, lsm, sdor, slor, z,
            # surface prognostic variables
            10u, 10v, 2d, 2t, msl, sp, skt, tcw,
            # diagnostics (outputs only)
            tp, cp,
            # two pressure levels instead of 13
            q_500, t_500, u_500, v_500, z_500,
            q_850, t_850, u_850, v_850, z_850,
          ]
        start: 2017-01-01
        end: 2017-01-08
  validation:
    datasets:
      data:
        dataset_config:
          select: ${dataloader.training.datasets.data.dataset_config.select}
        start: 2017-01-09
        end: 2017-01-10
  test:
    datasets:
      data:
        dataset_config:
          select: ${dataloader.training.datasets.data.dataset_config.select}
        start: 2017-01-09
        end: 2017-01-10

# ----------------------------------------------------------------------------- graph
graph:
  overwrite: False
  nodes:
    hidden:
      node_builder:
        resolution: 4

# ----------------------------------------------------------------------------- model
model:
  num_channels: 64
  compile: null
  processor:
    num_layers: 4
    num_chunks: 1

# ----------------------------------------------------------------------------- task
task:
  multistep_input: 1              # TODO(3) answer: only the current state as input (base: 2)
  rollout:
    start: 2                      # TODO(4) answer: 2 autoregressive steps inside each training step
    epoch_increment: 0
    maximum: 2

# ----------------------------------------------------------------------------- training
training:
  max_epochs: null
  max_steps: 500
  num_sanity_val_steps: 0
  precision: 16-mixed
  optimization:
    lr: 1.0e-3
    lr_scheduler:
      warmup_t: 20
      lr_min: 1.0e-5
  scalers:
    datasets:
      data:
        general_variable:
          weights:
            2t: 5                 # TODO(2) answer: 2 m temperature counts 5x (packaged default is 1)

# ----------------------------------------------------------------------------- diagnostics
diagnostics:
  callbacks: []
  log:
    mlflow:
      enabled: True
      offline: True
      tracking_uri: null
      authentication: False
      experiment_name: hour2-0    # keep: the scoreboard uses it as the option label
      run_name: 0-sfc+2lev-ms1-r2-2tx5   # TODO(5) answer
      terminal: False
      system: False
    interval: 10
  plot:
    settings:
      datashader: False
    callbacks: []
  benchmark_profiler:
    memory:
      enabled: False
    snapshot:
      enabled: False
  checkpoint:
    every_n_minutes:
      save_frequency: null
      num_models_saved: 0
    every_n_epochs:
      save_frequency: 5
      num_models_saved: 1
    every_n_train_steps:
      save_frequency: null
      num_models_saved: 0
  progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 10
