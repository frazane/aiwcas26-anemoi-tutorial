# =============================================================================
# AIWCAS 2026 Anemoi tutorial -- a *tiny* anemoi-training config (training-0.17.1)
#
# Trains a small GNN encoder-processor-decoder on the 10-day O96 ERA5 sample
# dataset on ONE GPU, in a few minutes, so you can watch the loss go down.
# It is NOT meant to produce a useful forecast model.
#
#   aiwcas validate configs/04_tiny_train.yaml      # after `source setup.sh`
#   aiwcas train    configs/04_tiny_train.yaml      # 1-GPU Slurm job; then `aiwcas log`, `aiwcas plot`
# which run, underneath (note: train needs an ABSOLUTE --config-path):
#   anemoi-training config validate --config-path $PWD/configs --config-name 04_tiny_train
#   anemoi-training train            --config-path $PWD/configs --config-name 04_tiny_train
#
# Everything not set here comes from the packaged defaults listed below; see
#   anemoi-training config generate -o my_configs/   (copies every default yaml)
# Command-line overrides win over this file, e.g.
#   aiwcas train configs/04_tiny_train.yaml training.max_steps=50 model.num_channels=32
# =============================================================================
defaults:
  - data: zarr                  # variables: forcing / diagnostic lists, normalisers
  - dataloader: native_grid     # dataset spec, date ranges, batch size, workers
  - diagnostics: evaluation     # logging, checkpoints, plots, progress bar
  - system: example             # hardware + input/output paths
  - graph: multi_scale          # anemoi-graphs recipe (built at startup if missing)
  - model: gnn                  # anemoi-models architecture
  - task: forecaster            # multistep input -> next step(s), rollout
  - training: single            # loss, scalers, optimiser, LR schedule, precision
  - _self_                      # this file last: its values override the defaults

config_validation: True         # validate against the pydantic schema at startup

# Hydra writes the composed config + a train.log per run; keep them out of the repo
hydra:
  run:
    dir: ${oc.env:SCRATCH}/aiwcas26/training/hydra/${now:%Y-%m-%d_%H-%M-%S}

# -----------------------------------------------------------------------------
# system: where things are, and what hardware we run on
# -----------------------------------------------------------------------------
system:
  hardware:
    accelerator: cuda           # 'cpu' to debug on the login node
    num_gpus_per_node: 1        # must match the Slurm request (--gres=gpu:N)
    num_nodes: 1                # must match --nodes
    num_gpus_per_model: 1       # >1 = model sharding (not needed here)
  input:
    # Any anemoi-datasets spec can go here (a path, or a dict passed to open_dataset)
    dataset: /leonardo_work/tra26_aiwcas/a08trd25/data/anemoi/aifs-ea-an-oper-0001-mars-o96-2017-2017-6h-v8-testing.zarr
    # Graph file: built from the `graph:` section at startup if it does not exist
    graph: ${oc.env:SCRATCH}/aiwcas26/training/graphs/tiny_o96_tri4.pt
  output:
    root: ${oc.env:SCRATCH}/aiwcas26/training/tiny

# -----------------------------------------------------------------------------
# dataloader: which dates go into training / validation, and how they are loaded
# The sample dataset covers 2017-01-01T06 .. 2017-01-10T18 (39 dates, 6-hourly).
# -----------------------------------------------------------------------------
dataloader:
  num_workers:                  # keep training + validation <= --cpus-per-task
    training: 6
    validation: 2
    test: 1
  batch_size:
    training: 1
    validation: 1
    test: 1
  limit_batches:
    training: null              # use every sample of the (tiny) training period
    validation: 4               # only 4 validation batches per epoch
    test: 1
  training:
    datasets:
      data:
        start: 2017-01-01
        end: 2017-01-08
  validation:
    datasets:
      data:
        start: 2017-01-09
        end: 2017-01-10
  test:
    datasets:
      data:
        start: 2017-01-09
        end: 2017-01-10

# -----------------------------------------------------------------------------
# graph: coarser hidden mesh than the default (refined icosahedron level 4 = 2562 nodes)
# -----------------------------------------------------------------------------
graph:
  overwrite: False              # reuse the graph file if it exists
  nodes:
    hidden:
      node_builder:
        resolution: 4

# -----------------------------------------------------------------------------
# model: a very small GNN (the default is 512 channels, 16 processor layers)
# -----------------------------------------------------------------------------
model:
  num_channels: 64
  processor:
    num_layers: 4
    num_chunks: 1

# -----------------------------------------------------------------------------
# task: 2 input steps (t-6h, t) -> predict t+6h; no rollout for the tiny run
# -----------------------------------------------------------------------------
task:
  multistep_input: 2
  rollout:
    start: 1
    epoch_increment: 0
    maximum: 1

# -----------------------------------------------------------------------------
# training: short run, higher LR, short warm-up
# -----------------------------------------------------------------------------
training:
  max_epochs: null
  max_steps: 500                # ~17 epochs of 29 samples; stops at the first limit reached
  num_sanity_val_steps: 0
  precision: 16-mixed           # use 32 (or bf16-mixed) on CPU
  optimization:
    lr: 1.0e-3                  # local LR; effective LR = lr * total_gpus / gpus_per_model
    lr_scheduler:
      warmup_t: 20              # steps
      lr_min: 1.0e-5

# -----------------------------------------------------------------------------
# diagnostics: offline logging only (compute nodes have no internet)
# -----------------------------------------------------------------------------
diagnostics:
  log:
    mlflow:
      enabled: True
      offline: True             # write to system.output.logs.mlflow, no server
      tracking_uri: null
      authentication: False
      experiment_name: aiwcas26-tiny
      run_name: tiny-o96
      terminal: False
      system: False
    interval: 10                # log every 10 steps
  plot:
    settings:
      datashader: False         # datashader is not installed in the tutorial env
    callbacks: []               # no plots during the tiny run (they cost time)
  benchmark_profiler:
    memory:
      enabled: False
    snapshot:
      enabled: False
  checkpoint:
    every_n_minutes:
      save_frequency: null
      num_models_saved: 0
    every_n_epochs:
      save_frequency: 5
      num_models_saved: 1
    every_n_train_steps:
      save_frequency: null
      num_models_saved: 0
  progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 10
