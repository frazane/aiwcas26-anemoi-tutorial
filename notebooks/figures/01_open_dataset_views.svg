<text x="203.6" y="473" font-size="12.5" fill="#52514e">dates (start, end, frequency)</text>
<rect x="425.0" y="461" width="14" height="14" rx="3" fill="#6250d6" fill-opacity="0.18" stroke="#6250d6" stroke-width="1.5"/>
<text x="445.0" y="473" font-size="12.5" fill="#52514e">variables (select, rename, …)</text>
<rect x="666.4" y="461" width="14" height="14" rx="3" fill="#eb6834" fill-opacity="0.18" stroke="#eb6834" stroke-width="1.5"/>
