<rect x="1" y="1" width="1178" height="498" rx="14" fill="#ffffff" stroke="#e3e3e0"/>
<text x="28" y="40" font-size="20" font-weight="700" fill="#0b0b0b">open_dataset(...) builds a tree of lazy views</text>
<text x="28" y="64" font-size="14" fill="#52514e">The cutout example from this notebook. Building the tree copies no data; reading ds[i] walks it.</text>
<rect x="28" y="130" width="140" height="74" rx="9" fill="#1baf7a" fill-opacity="0.14" stroke="#1baf7a" stroke-width="1.8"/>
<text x="98.0" y="154" font-size="15" font-weight="700" text-anchor="middle" fill="#0b0b0b">Zarr store</text>
<text x="98.0" y="174" font-size="12" text-anchor="middle" fill="#52514e" font-family="Menlo, Consolas, monospace">keisler … 1p0d</text>
<text x="98.0" y="190" font-size="12" text-anchor="middle" fill="#52514e" font-family="Menlo, Consolas, monospace">1° lat/lon, 3-hourly</text>
