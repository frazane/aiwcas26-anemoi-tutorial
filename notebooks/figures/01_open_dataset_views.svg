<path d="M492,337.0 L806,337.0 C843,337.0 828,272.0 865,272.0" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#ah3)"/>
<rect x="1068" y="216.0" width="92" height="72" rx="9" fill="#0b0b0b" fill-opacity="0.0" stroke="#0b0b0b" stroke-width="1.8"/>
<text x="1114.0" y="240.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0b0b0b" font-family="Menlo, Consolas, monospace">ds</text>
<text x="1114.0" y="260.0" font-size="12" text-anchor="middle" fill="#52514e" font-family="Menlo, Consolas, monospace">what you get</text>
