<line x1="492" y1="167.0" x2="511" y2="167.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#ah3)"/>
<line x1="654" y1="167.0" x2="673" y2="167.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#ah3)"/>
<rect x="28" y="300" width="140" height="74" rx="9" fill="#1baf7a" fill-opacity="0.14" stroke="#1baf7a" stroke-width="1.8"/>
<text x="98.0" y="324" font-size="15" font-weight="700" text-anchor="middle" fill="#0b0b0b">Zarr store</text>
<text x="98.0" y="344" font-size="12" text-anchor="middle" fill="#52514e" font-family="Menlo, Consolas, monospace">… o48 …</text>
<text x="98.0" y="360" font-size="12" text-anchor="middle" fill="#52514e" font-family="Menlo, Consolas, monospace">~2° global, 6-hourly</text>
