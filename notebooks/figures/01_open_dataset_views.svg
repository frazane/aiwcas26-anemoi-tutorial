<text x="260.0" y="154" font-size="15" font-weight="700" text-anchor="middle" fill="#0b0b0b">Subset</text>
<text x="260.0" y="174" font-size="12" text-anchor="middle" fill="#52514e" font-family="Menlo, Consolas, monospace">frequency='6h'</text>
<rect x="352" y="130" width="140" height="74" rx="9" fill="#6250d6" fill-opacity="0.1" stroke="#6250d6" stroke-width="1.8"/>
<text x="422.0" y="154" font-size="15" font-weight="700" text-anchor="middle" fill="#0b0b0b">Select</text>
<text x="422.0" y="174" font-size="12" text-anchor="middle" fill="#52514e" font-family="Menlo, Consolas, monospace">4 variables</text>
<rect x="514" y="130" width="140" height="74" rx="9" fill="#6250d6" fill-opacity="0.1" stroke="#6250d6" stroke-width="1.8"/>
<text x="584.0" y="154" font-size="15" font-weight="700" text-anchor="middle" fill="#0b0b0b">Rename</text>
<text x="584.0" y="174" font-size="12" text-anchor="middle" fill="#52514e" font-family="Menlo, Consolas, monospace">temperature_850</text>
<text x="584.0" y="190" font-size="12" text-anchor="middle" fill="#52514e" font-family="Menlo, Consolas, monospace">→ t_850, …</text>
