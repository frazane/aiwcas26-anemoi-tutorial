<text x="948.0" y="230.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0b0b0b">Cutout</text>
<text x="948.0" y="250.0" font-size="12" text-anchor="middle" fill="#52514e" font-family="Menlo, Consolas, monospace">regional points +</text>
<text x="948.0" y="266.0" font-size="12" text-anchor="middle" fill="#52514e" font-family="Menlo, Consolas, monospace">global points outside</text>
