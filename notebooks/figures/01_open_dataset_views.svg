<text x="594.0" y="92" font-size="13" text-anchor="middle" fill="#0b0b0b">ds[i]: the request travels root → leaves: each view translates the index (date, variables, points)</text>
<line x1="68" y1="410" x2="1160" y2="410" stroke="#eb6834" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#aho)"/>
<text x="594.0" y="432" font-size="13" text-anchor="middle" fill="#0b0b0b">arrays flow leaves → root: only the chunks needed for date i are read, then sliced, stacked and merged</text>
